<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Atlas / Upload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #ffffff;
      --color-surface: #f7f7f7;
      --color-text: #1a1a1a;
      --color-text-muted: #555555;
      --color-text-dim: #999999;
      --color-border: rgba(0,0,0,0.1);
      --color-accent: #1a1a1a;
      --color-success: #16a34a;
      --color-error: #dc2626;
      --color-blue: #2563eb;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
    }

    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--color-border);
    }
    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header-title span { color: var(--color-text-dim); font-weight: 400; }
    .header-back {
      font-size: 14px;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color var(--transition);
    }
    .header-back:hover { color: var(--color-text); }

    /* Layout */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* Config */
    .config {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg);
      color: var(--color-text);
      outline: none;
      transition: border-color var(--transition);
    }
    .field input:focus { border-color: var(--color-accent); }

    /* Drop zone */
    .dropzone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      margin-bottom: 24px;
    }
    .dropzone.dragover {
      border-color: var(--color-accent);
      background: var(--color-surface);
    }
    .dropzone-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.3;
    }
    .dropzone-text {
      font-size: 15px;
      color: var(--color-text-muted);
    }
    .dropzone-text strong { color: var(--color-text); }
    .dropzone-hint {
      font-size: 13px;
      color: var(--color-text-dim);
      margin-top: 6px;
    }

    /* File list */
    .file-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg);
    }
    .file-thumb {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--color-surface);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--color-text-dim);
      overflow: hidden;
    }
    .file-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-meta {
      font-size: 12px;
      color: var(--color-text-dim);
      margin-top: 2px;
    }
    .file-status {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-pending { background: var(--color-surface); color: var(--color-text-dim); }
    .status-uploading { background: #eff6ff; color: var(--color-blue); }
    .status-done { background: #f0fdf4; color: var(--color-success); }
    .status-error { background: #fef2f2; color: var(--color-error); }

    .file-result {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .file-result a {
      font-size: 13px;
      color: var(--color-blue);
      text-decoration: none;
      word-break: break-all;
    }
    .file-result a:hover { text-decoration: underline; }
    .copy-btn {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-bg);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .copy-btn:hover { border-color: var(--color-accent); color: var(--color-text); }

    /* Upload button */
    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--color-accent);
      color: var(--color-bg);
      cursor: pointer;
      transition: opacity var(--transition);
      margin-bottom: 32px;
    }
    .upload-btn:hover { opacity: 0.85; }
    .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Log */
    .log-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .log {
      background: var(--color-surface);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      max-height: 240px;
      overflow-y: auto;
      color: var(--color-text-muted);
      line-height: 1.8;
    }
    .log-entry { white-space: pre-wrap; word-break: break-all; }
    .log-entry.error { color: var(--color-error); }
    .log-entry.success { color: var(--color-success); }

    @media (max-width: 560px) {
      .config { grid-template-columns: 1fr; }
      .header { padding: 16px 20px; }
      .container { padding: 24px 16px 48px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">Atlas <span>/ Upload</span></div>
    <a href="index.html" class="header-back">Back to site</a>
  </header>

  <div class="container">
    <!-- Config -->
    <div class="config">
      <div class="field">
        <label for="gh-token">GitHub Token</label>
        <input type="password" id="gh-token" placeholder="ghp_...">
      </div>
      <div class="field">
        <label for="upload-path">Upload Path</label>
        <input type="text" id="upload-path" placeholder="images/" value="images/">
      </div>
    </div>

    <!-- Drop zone -->
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">&#8593;</div>
      <div class="dropzone-text"><strong>Drop files here</strong> or click to browse</div>
      <div class="dropzone-hint">Any file type supported</div>
    </div>
    <input type="file" id="file-input" multiple hidden>

    <!-- File list -->
    <div class="file-list" id="file-list"></div>

    <!-- Upload button -->
    <button class="upload-btn" id="upload-btn" disabled>Upload Files</button>

    <!-- Log -->
    <div class="log-title">Upload Log</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    const OWNER = 'rwb8771';
    const REPO = 'atlashydration';
    const PAGES_BASE = `https://${OWNER}.github.io/${REPO}`;
    const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;

    const tokenInput = document.getElementById('gh-token');
    const pathInput = document.getElementById('upload-path');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    const uploadBtn = document.getElementById('upload-btn');
    const logEl = document.getElementById('log');

    let queue = [];

    // Persist token
    tokenInput.value = localStorage.getItem('gh_upload_token') || '';
    tokenInput.addEventListener('input', () => {
      localStorage.setItem('gh_upload_token', tokenInput.value);
    });

    // Drag and drop
    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', e => addFiles(e.dataTransfer.files));
    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

    function addFiles(files) {
      for (const file of files) {
        const id = crypto.randomUUID();
        queue.push({ id, file, status: 'pending', url: null });
      }
      renderQueue();
      uploadBtn.disabled = queue.length === 0;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function isImage(file) {
      return file.type.startsWith('image/');
    }

    function renderQueue() {
      fileList.innerHTML = '';
      queue.forEach(item => {
        const el = document.createElement('div');
        el.className = 'file-item';
        el.id = `file-${item.id}`;

        // Thumbnail
        const thumb = document.createElement('div');
        thumb.className = 'file-thumb';
        if (isImage(item.file)) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(item.file);
          thumb.appendChild(img);
        } else {
          thumb.textContent = '\u25A0';
        }

        // Info
        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = item.file.name;
        name.title = item.file.name;

        const meta = document.createElement('div');
        meta.className = 'file-meta';
        meta.textContent = formatSize(item.file.size);

        info.appendChild(name);
        info.appendChild(meta);

        // Result link
        if (item.url) {
          const result = document.createElement('div');
          result.className = 'file-result';
          const a = document.createElement('a');
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = item.url;
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.addEventListener('click', () => {
            navigator.clipboard.writeText(item.url).then(() => {
              btn.textContent = 'Copied';
              setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
            });
          });
          result.appendChild(a);
          result.appendChild(btn);
          info.appendChild(result);
        }

        // Status badge
        const status = document.createElement('div');
        status.className = `file-status status-${item.status}`;
        const labels = { pending: 'Pending', uploading: 'Uploading\u2026', done: 'Done', error: 'Error' };
        status.textContent = labels[item.status] || item.status;

        el.appendChild(thumb);
        el.appendChild(info);
        el.appendChild(status);
        fileList.appendChild(el);
      });
    }

    function log(msg, type) {
      const entry = document.createElement('div');
      entry.className = `log-entry${type ? ' ' + type : ''}`;
      const ts = new Date().toLocaleTimeString();
      entry.textContent = `[${ts}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function fetchExistingSha(apiPath, token) {
      try {
        const res = await fetch(`${API_BASE}/${apiPath}`, {
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
          const data = await res.json();
          return data.sha;
        }
      } catch (_) {}
      return null;
    }

    async function uploadFile(item, token, basePath) {
      const filename = item.file.name;
      const path = basePath.replace(/\/+$/, '') + '/' + filename;
      const apiPath = path.replace(/^\/+/, '');

      item.status = 'uploading';
      renderQueue();
      log(`Uploading ${filename}...`);

      try {
        const content = await readFileAsBase64(item.file);

        // Check for existing file to get SHA
        const sha = await fetchExistingSha(apiPath, token);
        if (sha) {
          log(`File exists, updating (sha: ${sha.slice(0, 7)}...)`);
        }

        const body = {
          message: `Upload ${filename}`,
          content: content
        };
        if (sha) body.sha = sha;

        const res = await fetch(`${API_BASE}/${apiPath}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${res.status}`);
        }

        const url = `${PAGES_BASE}/${apiPath}`;
        item.status = 'done';
        item.url = url;
        log(`Uploaded ${filename} -> ${url}`, 'success');
      } catch (err) {
        item.status = 'error';
        log(`Failed ${filename}: ${err.message}`, 'error');
      }

      renderQueue();
    }

    uploadBtn.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      if (!token) { log('GitHub token is required.', 'error'); return; }

      const basePath = pathInput.value.trim() || 'images/';
      uploadBtn.disabled = true;

      const pending = queue.filter(i => i.status === 'pending' || i.status === 'error');
      if (pending.length === 0) { log('No files to upload.'); uploadBtn.disabled = false; return; }

      log(`Starting upload of ${pending.length} file(s)...`);

      for (const item of pending) {
        await uploadFile(item, token, basePath);
      }

      log('All uploads complete.');
      uploadBtn.disabled = queue.filter(i => i.status === 'pending' || i.status === 'error').length === 0;
    });
  </script>
</body>
</html>
