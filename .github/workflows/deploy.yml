name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Remix app
        run: npm run build
      - name: Copy static assets to build output
        run: |
          # SPA routing: copy index.html as 404.html for client-side routing on GitHub Pages
          cp build/client/index.html build/client/404.html
          # Copy blog, dashboard, and other static HTML pages to build output
          cp -r blog build/client/ 2>/dev/null || true
          cp -r dashboard build/client/ 2>/dev/null || true
          cp -r cloudflare-worker build/client/ 2>/dev/null || true
          cp shipping.html build/client/ 2>/dev/null || true
          cp privacy.html build/client/ 2>/dev/null || true
          cp seo.html build/client/ 2>/dev/null || true
          # Copy original JS files (loaded dynamically by Remix effects module)
          mkdir -p build/client/js
          cp js/shopify.js build/client/js/ 2>/dev/null || true
          cp js/main.js build/client/js/ 2>/dev/null || true
          # Copy CSS for static pages that load it directly
          mkdir -p build/client/css
          cp css/styles.css build/client/css/ 2>/dev/null || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/client'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
